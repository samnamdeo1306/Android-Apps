name: NotesMaker checks
on:
  push:
    paths:
      - 'apps/notesmaker/**'
      - '.github/workflows/notesmaker.yml'
  pull_request:
    paths:
      - 'apps/notesmaker/**'
      - '.github/workflows/notesmaker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notesmaker-${{ github.ref }}
  cancel-in-progress: true
env:
  # Native toolchain pinned in apps/notesmaker/gradle/libs.versions.toml (ADR-32).
  ANDROID_PACKAGES: "platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1"

jobs:
  # JVM tests, module rules, APK, lint and the Room schema check (ADR-34).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/notesmaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager $ANDROID_PACKAGES > /dev/null
      - name: Cache the whisper.cpp native build
        uses: actions/cache@v4
        with:
          path: apps/notesmaker/engine/whisper/.cxx
          key: whisper-cxx-${{ runner.os }}-${{ hashFiles('apps/notesmaker/gradle/libs.versions.toml', 'apps/notesmaker/engine/whisper/src/main/cpp/**') }}
      - name: Module rules and build-logic tests
        run: ./gradlew checkModuleGraph :build-logic:convention:test
      - name: JVM unit tests
        run: ./gradlew :core:domain:test :engine:notes-basic:test testDebugUnitTest
      - name: Debug APK (includes the native build for arm64-v8a and x86_64)
        run: ./gradlew assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/data/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::The Room schema changed. Commit core/data/schemas (and bump the version with a migration if it was released)."
            echo "$changes"
            for f in $(git ls-files --others --modified -- core/data/schemas); do echo "===== $f"; cat "$f"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notesmaker-build-reports
          path: |
            apps/notesmaker/**/build/reports/
            apps/notesmaker/build-logic/convention/build/reports/
            apps/notesmaker/app/build/outputs/apk/debug/*.apk
            apps/notesmaker/core/data/schemas/

  # Room, native, Compose UI and Hilt tests on emulators at the minimum and a current API level.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    defaults:
      run:
        working-directory: apps/notesmaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager $ANDROID_PACKAGES > /dev/null
      - name: Cache the whisper.cpp native build
        uses: actions/cache@v4
        with:
          path: apps/notesmaker/engine/whisper/.cxx
          key: whisper-cxx-${{ runner.os }}-${{ hashFiles('apps/notesmaker/gradle/libs.versions.toml', 'apps/notesmaker/engine/whisper/src/main/cpp/**') }}
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/notesmaker
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notesmaker-instrumented-reports-api-${{ matrix.api-level }}
          path: |
            apps/notesmaker/**/build/reports/androidTests/
            apps/notesmaker/**/build/outputs/androidTest-results/
